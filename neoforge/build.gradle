plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
        content {
            includeGroup 'net.blay09.mods'
        }
    }
    maven { url = "https://maven.firstdark.dev/snapshots" }
}

dependencies {
    implementation project(":sepple")
    jarJar project(":sepple")

    // Needed by Sepple
    jarJar "com.fasterxml.jackson.core:jackson-core:${project.jackson_version}"
    jarJar "com.fasterxml.jackson.core:jackson-databind:${project.jackson_version}"
    jarJar "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_version}"
    jarJar "io.github.astonbitecode:j4rs:${project.j4rs_version}"
    jarJar "at.yawk.lz4:lz4-java:${project.lz4_version}"

    implementation("net.blay09.mods:balm-neoforge:${balm_version}") {
        changing = balm_version.contains('SNAPSHOT')
    }

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:${ldlib2_version}")
    implementation("com.lowdragmc.kilagraph:kilagraph-neoforge-26.1:${kilagraph_version}")
    implementation("com.lowdragmc.photon:photon-neoforge-26.1:${photon_version}") {
        transitive = false
    }
}


neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        client2 {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            programArguments = ["--username", "Dev2"]
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('downloadAssets') {
    javaExecutable.set(System.getProperty('java.home') + "/bin/java")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}